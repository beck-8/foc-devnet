name: RunsOn foc-devnet smoke test

on:
  push:
    branches: [beck/runson-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the runner and foc-devnet checkout
        run: |
          uname -m
          nproc
          df -h .
          docker info --format '{{.ServerVersion}}'
          cargo metadata --offline --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "foc-devnet") | .name'
